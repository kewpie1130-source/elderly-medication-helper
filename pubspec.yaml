name: elderly_medication_app
description: "長者智慧用藥管理系統：OCR、SQLite、用藥提醒與服藥紀錄。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  image_picker: ^1.2.2
  google_mlkit_text_recognition: ^0.15.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  http: ^1.2.0
  uuid: ^4.5.2
  flutter_tts: ^4.1.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.3.x uses JNI/CMake, which cannot compile from this Windows user path.
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/design/
    - assets/sample/mock_prescription_zh_tw.png
